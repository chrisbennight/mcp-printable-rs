[package]
name = "model-library"
description = "Bounded typed clients for public 3D model repositories used by Printable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
bytes = "1"
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
url = "2"
zeroize = "1.9"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
