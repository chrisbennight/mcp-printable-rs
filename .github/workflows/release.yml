name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printable-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PRINTABLE_REGISTRY: ghcr.io
  PRINTABLE_IMAGE_NAMESPACE: chrisbennight
  PRINTABLE_SOURCE_REPOSITORY: https://github.com/chrisbennight/mcp-printable-rs

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CRATES_INDEX_URL: ${{ vars.CRATES_INDEX_URL }}
      SOURCE_REVISION: ${{ github.sha }}
      GRYPE_VERSION: "0.110.0"
      GRYPE_CHECKSUM: aaa98d27d2d7efd9317c6a1ad6d9b15f3e65bab320e7d03bde41e251387bb71c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisbennight/mcp-printable-rs
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and build prerequisites
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          test -n "$CRATES_INDEX_URL"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git
          rustup show active-toolchain
          docker_config="${RUNNER_TEMP}/printable-docker"
          mkdir -m 0700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - name: Install policy tooling
        run: |
          python3 -m venv "${RUNNER_TEMP}/printable-python"
          "${RUNNER_TEMP}/printable-python/bin/python" -m pip install --disable-pip-version-check -r requirements-tooling.txt
          printf '%s\n' "${RUNNER_TEMP}/printable-python/bin" >> "$GITHUB_PATH"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GRYPE_CHECKSUM" "${RUNNER_TEMP}/grype.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C "$RUNNER_TEMP" grype
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, publish, and test immutable candidate images
        run: ./build-docker.sh --push-candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: printable-candidate
          path: target/release/candidate.json
          if-no-files-found: error
          retention-days: 30
