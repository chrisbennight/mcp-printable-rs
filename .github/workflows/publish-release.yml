name: Publish qualified release

on:
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: Successful public Release workflow run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: printable-release-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PRINTABLE_REGISTRY: ghcr.io
      PRINTABLE_IMAGE_NAMESPACE: chrisbennight
      PRINTABLE_SOURCE_REPOSITORY: https://github.com/chrisbennight/mcp-printable-rs
      CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
      QUALIFIER_ID: ${{ vars.PRINTABLE_QUALIFIER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the candidate build
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_authorization.py prepare "$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: printable-candidate
          path: target/release
          run-id: ${{ inputs.candidate-run-id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify trusted GPU evidence and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_authorization.py publish "$CANDIDATE_RUN_ID" target/release/candidate.json
