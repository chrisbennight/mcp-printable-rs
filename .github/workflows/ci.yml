name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git
      - name: Activate the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust
        run: cargo test --workspace --all-features --locked
      - name: Check Python syntax
        run: python3 -m compileall -q addon scripts
      - name: Test the Blender bridge without Blender
        run: PYTHONPATH=addon python3 -m unittest discover -s addon/tests -v
      - name: Test release policy and dependency routing
        run: |
          python3 -m venv "${RUNNER_TEMP}/printable-python"
          "${RUNNER_TEMP}/printable-python/bin/python" -m pip install --disable-pip-version-check -r requirements-tooling.txt
          printf '%s\n' "${RUNNER_TEMP}/printable-python/bin" >> "$GITHUB_PATH"
          PYTHONPATH=scripts "${RUNNER_TEMP}/printable-python/bin/python" -m unittest discover -s scripts/tests -v
      - name: Validate documentation
        run: python3 scripts/docgate
      - name: Validate shell scripts and publication permissions
        run: |
          bash -n build-docker.sh scripts/run-headless-blender scripts/smoke-blender-gpu scripts/smoke-blender-cpu scripts/smoke-release-pair
          sh scripts/check-release-target

  workflow:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
      - name: Validate GitHub workflows
        run: '"${RUNNER_TEMP}/actionlint"'

  fuzz:
    name: Confined-source fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_NIGHTLY: nightly-2026-07-01
      # renovate: datasource=crate depName=cargo-fuzz
      CARGO_FUZZ_VERSION: "0.13.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned fuzz tooling
        run: |
          rustup toolchain install "${RUST_NIGHTLY}" --profile minimal
          cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"
      - name: Exercise the confined OpenSCAD source gate
        working-directory: crates/printable-scad
        run: |
          cargo "+${RUST_NIGHTLY}" fuzz build gate
          cargo "+${RUST_NIGHTLY}" fuzz run gate -- -max_total_time=30 -rss_limit_mb=2048

  containers:
    name: Container integration (software graphics)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - name: Verify private local files stay outside the build context
        run: scripts/test-build-context
      - name: Build the server and matching external smoke driver
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag printable-server:ci .
          docker buildx build --platform linux/amd64 \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --target smoke-export --output type=local,dest=target/release .
          test -x target/release/printable-smoke
      - name: Build Blender
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --file blender/Dockerfile --tag printable-blender:ci .
      - name: Build and verify native CAD
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --target cad-runtime --tag printable-cad:ci .
          # The Docker driver can resolve the runtime just loaded into the local image store.
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg CAD_IMAGE=printable-cad:ci \
            --file cad/Dockerfile.smoke --tag printable-cad-smoke:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,size=2g,uid=10001,gid=10001,mode=1770 \
            --entrypoint /opt/cad/bin/python printable-cad-smoke:ci \
            /opt/printable/cad/smoke.py --worker
      - name: Build and verify native slicing
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --target slicer-runtime --tag printable-slicer:ci .
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg SLICER_IMAGE=printable-slicer:ci \
            --file slicer/Dockerfile.smoke --tag printable-slicer-smoke:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,size=2g,uid=10001,gid=10001,mode=1770 \
            --entrypoint /usr/bin/python3 printable-slicer-smoke:ci \
            /opt/printable/slicer-smoke.py
      - name: Exercise the independent installation and direct client
        run: python3 scripts/test-installation.py printable-server:ci printable-blender:ci --cad-image printable-cad:ci --slicer-image printable-slicer:ci --recovery --evidence-dir target/installation-evidence
      - name: Retain discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: discovery-evidence
          path: target/installation-evidence/discovery
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Blender capabilities and shutdown recovery
        run: scripts/smoke-blender-cpu printable-blender:ci
      - name: Verify packaged license notices
        run: python3 scripts/test-image-notices.py printable-server:ci printable-blender:ci --cad-image printable-cad:ci --slicer-image printable-slicer:ci
      - name: Exercise native views, product workflows, and isolated render jobs
        env:
          PRINTABLE_PAIR_SMOKE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          scripts/smoke-release-pair \
            printable-server:ci printable-blender:ci \
            target/release/printable-smoke smoke/expected-tools.txt
      - name: Verify and record tested image IDs
        run: python3 scripts/publish_images.py record "$GITHUB_SHA" target/release/image-ids.json
      - name: Save tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save printable-server:ci printable-blender:ci printable-cad:ci printable-slicer:ci | gzip -1 > target/release/images.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-images
          path: |
            target/release/images.tar.gz
            target/release/image-ids.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish images
    needs: [verify, workflow, fuzz, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tested-images
          path: target/release
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - name: Load tested images and install the scanner
        env:
          GRYPE_VERSION: "0.110.0"
          GRYPE_CHECKSUM: aaa98d27d2d7efd9317c6a1ad6d9b15f3e65bab320e7d03bde41e251387bb71c
        run: |
          docker load --input target/release/images.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GRYPE_CHECKSUM" "${RUNNER_TEMP}/grype.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C "$RUNNER_TEMP" grype
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan and publish tested images
        run: python3 scripts/publish_images.py publish "$GITHUB_SHA" target/release/image-ids.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image
          path: release-image.txt
          if-no-files-found: error
