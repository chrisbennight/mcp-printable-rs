name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Line tables keep file and line numbers in backtraces while making test
      # binaries and the dependency cache much smaller.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - name: Install native build dependencies
        if: steps.scope.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git
      - name: Activate the repository Rust toolchain
        if: steps.scope.outputs.rust == 'true'
        run: rustup show active-toolchain
      # Pull requests reuse dependencies that main compiled; only main stores them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.rust == 'true'
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check Rust formatting
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Lint Rust
        if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test Rust
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --workspace --all-features --locked
      - name: Check Python syntax
        if: steps.scope.outputs.addon == 'true' || steps.scope.outputs.tooling == 'true'
        run: python3 -m compileall -q addon scripts
      - name: Test the Blender bridge without Blender
        if: steps.scope.outputs.addon == 'true'
        run: PYTHONPATH=addon python3 -m unittest discover -s addon/tests -v
      - name: Test release policy and dependency routing
        if: steps.scope.outputs.tooling == 'true'
        run: |
          python3 -m venv "${RUNNER_TEMP}/printable-python"
          "${RUNNER_TEMP}/printable-python/bin/python" -m pip install --disable-pip-version-check -r requirements-tooling.txt
          printf '%s\n' "${RUNNER_TEMP}/printable-python/bin" >> "$GITHUB_PATH"
          PYTHONPATH=scripts "${RUNNER_TEMP}/printable-python/bin/python" -m unittest discover -s scripts/tests -v
      - name: Validate documentation
        if: steps.scope.outputs.docs == 'true'
        run: python3 scripts/docgate
      - name: Validate shell scripts and publication permissions
        if: steps.scope.outputs.shell == 'true' || steps.scope.outputs.tooling == 'true'
        run: |
          for script in build-docker.sh scripts/run-headless-blender scripts/smoke-blender-gpu scripts/smoke-blender-cpu scripts/smoke-release-pair scripts/smoke-recon-worker; do
            bash -n "$script"
          done
          sh scripts/check-release-target

  workflow:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - name: Install pinned actionlint
        if: steps.scope.outputs.workflows == 'true'
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
      - name: Validate GitHub workflows
        if: steps.scope.outputs.workflows == 'true'
        run: '"${RUNNER_TEMP}/actionlint" -ignore ''unexpected key "queue" for "concurrency" section'''

  fuzz:
    name: Confined-source fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_NIGHTLY: nightly-2026-07-01
      # renovate: datasource=crate depName=cargo-fuzz
      CARGO_FUZZ_VERSION: "0.13.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - name: Install pinned fuzz tooling
        if: steps.scope.outputs.fuzz == 'true'
        run: |
          rustup toolchain install "${RUST_NIGHTLY}" --profile minimal
          cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"
      - name: Exercise the confined OpenSCAD source gate
        if: steps.scope.outputs.fuzz == 'true'
        working-directory: crates/printable-scad
        run: |
          cargo "+${RUST_NIGHTLY}" fuzz build gate
          cargo "+${RUST_NIGHTLY}" fuzz run gate -- -max_total_time=30 -rss_limit_mb=2048

  containers:
    name: Container integration (software graphics)
    outputs:
      images: ${{ steps.scope.outputs.images }}
      publish: ${{ steps.scope.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.scope.outputs.images == 'true'
        with:
          cache-binary: false
      - name: Make room for the CUDA reconstruction image
        if: steps.scope.outputs.images == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Verify private local files stay outside the build context
        if: steps.scope.outputs.images == 'true'
        run: scripts/test-build-context
      # One bake builds the whole set in parallel and compiles the shared Rust
      # stage once. Pull requests reuse layers that main stored; main rebuilds
      # without reading them, so published images carry fresh packages.
      - name: Build the matching image set and external smoke driver
        if: steps.scope.outputs.images == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          SOURCE_REVISION: ${{ github.sha }}
          CACHE_MODE: ${{ github.event_name == 'pull_request' && 'read' || github.event_name == 'push' && 'write' || '' }}
        with:
          source: .
          files: docker-bake.hcl
      - name: Check the external smoke driver
        if: steps.scope.outputs.images == 'true'
        run: test -x target/release/printable-smoke
      - name: Verify native CAD
        if: steps.scope.outputs.images == 'true'
        run: |
          # The Docker driver can resolve the runtime just loaded into the local image store.
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg CAD_IMAGE=printable-cad:ci \
            --file cad/Dockerfile.smoke --tag printable-cad-smoke:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,size=2g,uid=10001,gid=10001,mode=1770 \
            --entrypoint /opt/cad/bin/python printable-cad-smoke:ci \
            /opt/printable/cad/smoke.py --worker
      - name: Verify native slicing
        if: steps.scope.outputs.images == 'true'
        run: |
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg SLICER_IMAGE=printable-slicer:ci \
            --file slicer/Dockerfile.smoke --tag printable-slicer-smoke:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,size=2g,uid=10001,gid=10001,mode=1770 \
            --entrypoint /usr/bin/python3 printable-slicer-smoke:ci \
            /opt/printable/slicer-smoke.py
      - name: Verify photo reconstruction
        if: steps.scope.outputs.images == 'true'
        run: |
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg RECON_IMAGE=printable-recon:ci \
            --file recon/Dockerfile.smoke --tag printable-recon-smoke:ci .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,size=1g,uid=10001,gid=10001,mode=1770 \
            --env PYTHONPATH=/opt/printable/recon --env HOME=/tmp \
            --entrypoint /opt/recon/bin/python printable-recon-smoke:ci \
            -m unittest discover -s /opt/printable/recon/tests -v
          scripts/smoke-recon-worker printable-recon:ci
      # Software rendering compiles every shader on first use. Main keeps the
      # compiled shaders for later runs; Mesa ignores entries from another driver build.
      - name: Restore compiled software shaders
        if: steps.scope.outputs.images == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-shaders
          key: software-shaders-${{ hashFiles('blender/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: software-shaders-${{ hashFiles('blender/Dockerfile') }}-
      - name: Share compiled shaders with the Blender containers
        if: steps.scope.outputs.images == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/software-shaders"
          sudo chown -R 10001:10001 "${RUNNER_TEMP}/software-shaders"
      - name: Exercise the independent installation and direct client
        if: steps.scope.outputs.images == 'true'
        run: python3 scripts/test-installation.py printable-server:ci printable-blender:ci --cad-image printable-cad:ci --slicer-image printable-slicer:ci --recovery --evidence-dir target/installation-evidence --shader-cache "${RUNNER_TEMP}/software-shaders"
      - name: Retain discovery evidence
        if: steps.scope.outputs.images == 'true' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: discovery-evidence
          path: target/installation-evidence/discovery
          if-no-files-found: ignore
          retention-days: 14
      - name: Check Blender capabilities and shutdown recovery
        if: steps.scope.outputs.images == 'true'
        env:
          PRINTABLE_SMOKE_SHADER_CACHE: ${{ runner.temp }}/software-shaders
        run: scripts/smoke-blender-cpu printable-blender:ci
      - name: Verify packaged license notices
        if: steps.scope.outputs.images == 'true'
        run: python3 scripts/test-image-notices.py printable-server:ci printable-blender:ci --cad-image printable-cad:ci --slicer-image printable-slicer:ci --recon-image printable-recon:ci
      - name: Exercise native views, product workflows, and isolated render jobs
        if: steps.scope.outputs.images == 'true'
        env:
          PRINTABLE_PAIR_SMOKE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          PRINTABLE_SMOKE_SHADER_CACHE: ${{ runner.temp }}/software-shaders
        run: |
          scripts/smoke-release-pair \
            printable-server:ci printable-blender:ci \
            target/release/printable-smoke smoke/expected-tools.txt
      - name: Return compiled shaders to the runner
        if: steps.scope.outputs.images == 'true' && (always())
        run: |
          if [ -d "${RUNNER_TEMP}/software-shaders" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/software-shaders"
          fi
      - name: Store compiled software shaders
        if: steps.scope.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/software-shaders
          key: software-shaders-${{ hashFiles('blender/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify and record tested image IDs
        if: steps.scope.outputs.images == 'true'
        run: python3 scripts/publish_images.py record "$GITHUB_SHA" target/release/image-ids.json
      # Pull requests check the declared supplement; SBOMs are publication evidence.
      - name: Validate the declared component supplement
        if: steps.scope.outputs.images == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: PYTHONPATH=scripts python3 -c 'import sys; from release_evidence import supplement; supplement(sys.argv[1])' "$GITHUB_SHA"
      - name: Install the pinned SBOM generator
        if: steps.scope.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          SYFT_VERSION: "1.54.1"
          SYFT_CHECKSUM: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_CHECKSUM" "${RUNNER_TEMP}/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "$RUNNER_TEMP" syft
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Generate standard SBOMs for tested images
        if: steps.scope.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python3 scripts/release_evidence.py "$GITHUB_SHA" target/release/image-ids.json target/release/evidence
      - name: Save tested images
        if: steps.scope.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          docker save printable-server:ci printable-blender:ci printable-cad:ci printable-slicer:ci printable-recon:ci | zstd -T0 -3 -q -o target/release/images.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.scope.outputs.images == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          name: tested-images
          path: |
            target/release/images.tar.zst
            target/release/image-ids.json
            target/release/evidence
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  publish:
    concurrency:
      group: printable-image-publication
      queue: max
      cancel-in-progress: false
    name: Publish images
    needs: [verify, workflow, fuzz, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.containers.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tested-images
          path: target/release
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
      - name: Load tested images and install the scanner
        env:
          GRYPE_VERSION: "0.110.0"
          GRYPE_CHECKSUM: aaa98d27d2d7efd9317c6a1ad6d9b15f3e65bab320e7d03bde41e251387bb71c
        run: |
          zstd -dc target/release/images.tar.zst | docker load
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GRYPE_CHECKSUM" "${RUNNER_TEMP}/grype.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C "$RUNNER_TEMP" grype
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install the pinned attestation verifier
        env:
          GH_VERSION: "2.102.0"
          GH_CHECKSUM: bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --connect-timeout 10 --max-time 120 \
            --output "${RUNNER_TEMP}/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_CHECKSUM" "${RUNNER_TEMP}/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/gh.tar.gz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          printf '%s\n' "${RUNNER_TEMP}/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan and push tested component images
        id: components
        run: python3 scripts/publish_images.py push "$GITHUB_SHA" target/release/image-ids.json
      - uses: ./.github/actions/attest-runtime
        with:
          role: server
          name: ${{ steps.components.outputs.server_name }}
          digest: ${{ steps.components.outputs.server_digest }}
      - uses: ./.github/actions/attest-runtime
        with:
          role: blender
          name: ${{ steps.components.outputs.blender_name }}
          digest: ${{ steps.components.outputs.blender_digest }}
      - uses: ./.github/actions/attest-runtime
        with:
          role: cad
          name: ${{ steps.components.outputs.cad_name }}
          digest: ${{ steps.components.outputs.cad_digest }}
      - uses: ./.github/actions/attest-runtime
        with:
          role: slicer
          name: ${{ steps.components.outputs.slicer_name }}
          digest: ${{ steps.components.outputs.slicer_digest }}
      - uses: ./.github/actions/attest-runtime
        with:
          role: recon
          name: ${{ steps.components.outputs.recon_name }}
          digest: ${{ steps.components.outputs.recon_digest }}
      - name: Verify attestations and publish the release record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_images.py record-release "$GITHUB_SHA" target/release/evidence/candidate.json
      - name: Sign the completed evidence record
        id: record_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.record.outputs.name }}
          subject-digest: ${{ steps.record.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the published evidence and advance update discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_images.py complete "$GITHUB_SHA" release-image.txt
      - name: Retain image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-security-scans
          path: target/release/evidence/scans/*.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Retain candidate evidence for diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-evidence
          path: target/release/evidence
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image
          path: release-image.txt
          if-no-files-found: error
