name: Install release scanner
description: Install the checksum-verified scanner used by the release security policy
runs:
  using: composite
  steps:
    - name: Install pinned Grype
      shell: bash
      env:
        GRYPE_VERSION: "0.110.0"
        GRYPE_CHECKSUM: aaa98d27d2d7efd9317c6a1ad6d9b15f3e65bab320e7d03bde41e251387bb71c
      run: |
        curl --fail --location --proto '=https' --tlsv1.2 \
          --retry 3 --connect-timeout 10 --max-time 120 \
          --output "${RUNNER_TEMP}/grype.tar.gz" \
          "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
        printf '%s  %s\n' "$GRYPE_CHECKSUM" "${RUNNER_TEMP}/grype.tar.gz" | sha256sum --check --strict
        tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C "$RUNNER_TEMP" grype
        printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
