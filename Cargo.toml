[workspace]
resolver = "3"
members = [
    "crates/printable-server",
    "crates/printable-blender",
    "crates/printable-geom",
    "crates/printable-flame",
    "crates/printable-scad",
    "crates/printable-workspace",
    "crates/printable-imaging",
    "crates/bambuddy-api",
    "crates/model-library",
]
# The cargo-fuzz crate needs a nightly toolchain + sanitizer runtime; keep it
# out of the default workspace build (it has its own detached [workspace]).
exclude = ["crates/printable-scad/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/chrisbennight/mcp-printable-rs"

# Mesh numerics in the geometry and head-model crates, and in dependencies such
# as manifold3d and parry, dominate test time when unoptimized. Optimizing them
# keeps debug assertions, overflow checks and debug info.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.printable-geom]
opt-level = 2

[profile.dev.package.printable-flame]
opt-level = 2
